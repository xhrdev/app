version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    assignees:
      - skilbjo
    rebase-strategy: auto
    ignore:
      - dependency-name: devtools-protocol

      - dependency-name: react-day-picker
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    versioning-strategy: increase
    open-pull-requests-limit: 10
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    assignees:
      - skilbjo
    # private shared workflows; dependabot cannot read the repo
    ignore:
      - dependency-name: "xhrdev/*"
    groups:
      github-actions:
        patterns:
          - '*'
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
