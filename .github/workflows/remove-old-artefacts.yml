name: Remove old artefacts
on:
  schedule:
    - cron: '0 0 * * 0' # every week (Sunday)
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
jobs:
  remove-old-artefacts:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - name: Remove old artefacts
        uses: c-hive/gha-remove-artifacts@v1
        with:
          age: '1 day'
          skip-recent: 1
