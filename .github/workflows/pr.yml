# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: pr

on:
  pull_request:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - LICENSE

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# inlined: a public repo cannot call reusable workflows stored in a private repo
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: make ci

  dependabot-approve-and-automerge:
    runs-on: ubuntu-slim
    timeout-minutes: 2
    needs:
      - build-and-test
    permissions:
      pull-requests: write
      contents: write
    if: ${{ github.actor == 'dependabot[bot]' }}
    steps:
      - uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # auto-merge first, then approve: once the PR is approved and this job is its
      # only pending check, github reports it as unstable and refuses to enable
      # auto-merge. while it still waits on the review, enabling it is allowed.
      - name: Enable auto-merge for Dependabot PRs
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Approve a PR
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
